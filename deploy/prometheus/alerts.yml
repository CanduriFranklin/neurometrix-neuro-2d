groups:
  - name: core-2d-clinical
    interval: 30s
    rules:
      - alert: HighPipelineLatency
        expr: histogram_quantile(0.99, rate(core2d_pipeline_duration_ms_bucket[5m])) > 500
        for: 5m
        labels: { severity: warning, service: core-2d }
        annotations:
          summary: "Pipeline p99 exceeds 500 ms"
          description: "Clinical SLA breached: {{ $value }} ms"

      - alert: HighFailureRate
        expr: rate(core2d_messages_failed_total[5m]) / rate(core2d_messages_consumed_total[5m]) > 0.05
        for: 5m
        labels: { severity: critical, service: core-2d }
        annotations:
          summary: "Failure rate > 5%"
          description: "Sustained failure rate"

      - alert: KafkaConsumerStalled
        expr: rate(core2d_messages_consumed_total[5m]) == 0
        for: 10m
        labels: { severity: warning, service: core-2d }
        annotations:
          summary: "No messages consumed in 10 minutes"
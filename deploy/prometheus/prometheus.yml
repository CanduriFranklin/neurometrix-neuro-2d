global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: neurometrix-local

scrape_configs:
  - job_name: 'core-2d'
    static_configs:
      - targets: ['host.containers.internal:9091']
        labels:
          service: 'core-2d'
          env: 'local'
    metrics_path: /metrics

  - job_name: 'router'
    static_configs:
      - targets: ['host.containers.internal:9090']
        labels:
          service: 'router'
          env: 'local'
    metrics_path: /metrics